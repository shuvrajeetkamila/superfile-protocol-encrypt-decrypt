name: Build Superfile

# §8: builds ONE single-file desktop executable per OS from the same source.
#   * --self-test is a hard gate: a broken build can never reach a release.
#   * on a version tag push (v*), all verified binaries are attached to a
#     GitHub Release; every run also uploads them as build artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/Superfile.exe
            magic: "4d5a"                      # PE  ("MZ")   — real Windows .exe
          - os: ubuntu-latest
            exe: dist/Superfile
            magic: "7f454c46"                  # ELF
          - os: macos-latest
            exe: dist/Superfile
            magic: "cffaedfe cafebabe feedface feedfacf"  # Mach-O thin/fat, 32/64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Source test suite (safety + honesty gate)
        run: python -m tests.test_all

      - name: Build single-file executable (desktop.spec)
        run: python -m PyInstaller --clean --noconfirm desktop.spec

      - name: Verify REAL file type by magic bytes (not by extension)
        shell: bash
        run: |
          python - <<'PY'
          import os
          exe = os.environ["EXE_PATH"]
          head = open(exe, "rb").read(4).hex()
          allowed = os.environ["MAGIC"].split()
          assert head in allowed, f"{exe} starts with {head}, expected one of {allowed}"
          print(f"OK: {exe} magic bytes = {head} (one of {allowed})")
          PY
        env:
          EXE_PATH: ${{ matrix.exe }}
          MAGIC: ${{ matrix.magic }}

      - name: Self-test packaged binary (release gate)
        shell: bash
        run: |
          set -o pipefail
          chmod +x "${{ matrix.exe }}" || true
          "${{ matrix.exe }}" --self-test 2>&1 | tee selftest.log
          ! grep -q "WARNING: could not load" selftest.log

      - name: Release battery on the packaged binary (format matrix + E2E + security + SFP)
        shell: bash
        run: |
          set -o pipefail
          python tests/packaged_e2e.py "${{ matrix.exe }}" 2>&1 | tee e2e.log

      - name: Size budget check (< 120 MB, measured)
        shell: bash
        run: |
          python - <<'PY'
          import os
          n = os.path.getsize(os.environ["EXE_PATH"])
          print(f"{os.environ['EXE_PATH']}: {n} bytes = {n/1024/1024:.2f} MiB")
          assert n < 120 * 1024 * 1024, f"OVER BUDGET: {n} bytes"
          PY
        env:
          EXE_PATH: ${{ matrix.exe }}

      - name: Name the artifact
        id: nameit
        shell: bash
        run: |
          ARCH="$(uname -m)"
          case "${{ runner.os }}" in
            Windows) ASSET="Superfile-windows-${ARCH}.exe" ;;
            Linux)   ASSET="Superfile-linux-${ARCH}" ;;
            macOS)   ASSET="Superfile-macos-${ARCH}" ;;
          esac
          mv "${{ matrix.exe }}" "${ASSET}"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nameit.outputs.asset }}
          path: ${{ steps.nameit.outputs.asset }}
          if-no-files-found: error

  release:
    name: attach verified binaries to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
